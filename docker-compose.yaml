name: Wowza Streaming Engine My First Module 
services:
    wse:
        hostname: wse.docker
        # WebRTC data channels need 4.12 or later; there is no versioned trial tag to pin to
        image: wowza/wowza-streaming-engine:latest-trial
        environment:
            - WSE_LICENSE_KEY=$WSE_LICENSE_KEY
            - ADMIN_USER=admin
            - ADMIN_PASSWORD=password
            - IPWHITELIST=*
            - TRANSCODER=disabled #enabled | disabled | remove to not change
            - LOG_LEVEL=INFO #DEBUG INFO WARN ERROR
            - SIMU_LIVE=enabled
        volumes:
            - ./build/libs:/usr/local/WowzaStreamingEngine/lib.addon
            - ./wse.addon/conf:/usr/local/WowzaStreamingEngine/conf.addon
        ports:
            - 80:80
            - 443:443
            - 9443:9443 # HTTPS, metadata injection API only (used by the sample pages when served over HTTPS)
            - 554:554
            - 1935:1935
            - 8087:8087
            - 6970-6999:6970-6999/udp
            - 10000:10000/udp
        env_file:
            - .env            
    manager:
        hostname: wsem.docker
        image: wowza/wowza-streaming-engine-manager:latest
        environment:
            - LOG_LEVEL=WARN #DEBUG INFO WARN ERROR
            - WSE_HOST=http://wse.docker:8087
            # Sent by the sample pages as the metadata-api-key header; must match metadataApiKey in wse.addon/conf/VHost.xml
            - METADATA_API_KEY=secretkey
            - PLAYER_TOKEN=$PLAYER_TOKEN
            - ADMIN_USER=admin
            - ADMIN_PASSWORD=password
            # HTTPS for the manager and sample pages, using the same Wowza-provided
            # wse-trial.wowza.com certificate the engine uses (manager 4.10+).
            # For your own certificate set JKS_FILE and JKS_PASSWORD instead.
            - JKS_TRIAL=true
        volumes:
            #- ./webpage:/usr/local/tomcat/webapps/ROOT/metadata-injection puts behind WSEM auth
            - ./webpage:/usr/local/tomcat/webapps/metadata-injection
        ports:
            - 8088:8080
            - 8443:8443 # HTTPS; the manager's SSL connector listens on 8443 inside the container
        env_file:
            - .env